<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Predictor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0f14;
    --surface: #161b25;
    --surface2: #1e2636;
    --border: #2a3347;
    --accent: #4f8ef7;
    --accent2: #7c6af7;
    --green: #22d3a5;
    --red: #f05a5a;
    --amber: #f5a623;
    --text: #e8edf5;
    --muted: #7a8aa8;
    --radius: 14px;
    --font: 'Segoe UI', system-ui, sans-serif;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }

  .app { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }

  /* Header */
  .header { text-align: center; margin-bottom: 3rem; }
  .header-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(79,142,247,0.12); border: 1px solid rgba(79,142,247,0.3); border-radius: 99px; padding: 6px 18px; font-size: 12px; color: var(--accent); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 1.2rem; }
  .header h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 700; background: linear-gradient(135deg, #e8edf5 0%, #4f8ef7 50%, #7c6af7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1.15; }
  .header p { color: var(--muted); font-size: 1rem; margin-top: 0.8rem; max-width: 560px; margin-left: auto; margin-right: auto; }

  /* Layout */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
  @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; }
  .card-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 1.25rem; display: flex; align-items: center; gap: 8px; }
  .card-title svg { opacity: 0.6; }

  /* Form */
  .form-group { margin-bottom: 1.1rem; }
  .form-label { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 0.45rem; }
  .form-value { color: var(--text); font-weight: 600; font-size: 14px; min-width: 36px; text-align: right; }
  input[type=range] { width: 100%; height: 4px; border-radius: 9px; outline: none; cursor: pointer; -webkit-appearance: none; background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--pct, 50%), var(--border) var(--pct, 50%), var(--border) 100%); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg); cursor: pointer; }

  /* Button */
  .btn { width: 100%; padding: 14px; border-radius: 10px; border: none; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 1.5rem; transition: opacity 0.2s, transform 0.1s; letter-spacing: 0.02em; }
  .btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Results */
  .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem; }
  .result-card { background: var(--surface2); border-radius: 12px; padding: 1.1rem 1.2rem; border: 1px solid var(--border); }
  .result-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 0.5rem; }
  .result-value { font-size: 1.6rem; font-weight: 700; line-height: 1; }
  .result-sub { font-size: 12px; color: var(--muted); margin-top: 0.3rem; }

  .tag { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; }
  .tag-green { background: rgba(34,211,165,0.15); color: var(--green); }
  .tag-red { background: rgba(240,90,90,0.15); color: var(--red); }
  .tag-amber { background: rgba(245,166,35,0.15); color: var(--amber); }
  .tag-blue { background: rgba(79,142,247,0.15); color: var(--accent); }

  /* Progress bar */
  .progress-wrap { margin: 0.5rem 0; }
  .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .progress-bar { height: 6px; background: var(--border); border-radius: 9px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 9px; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }

  /* Feature importance */
  .feat-row { display: flex; align-items: center; gap: 10px; margin-bottom: 0.55rem; }
  .feat-name { font-size: 12px; color: var(--muted); width: 150px; flex-shrink: 0; }
  .feat-bar-wrap { flex: 1; height: 6px; background: var(--border); border-radius: 9px; overflow: hidden; }
  .feat-bar-fill { height: 100%; border-radius: 9px; background: linear-gradient(90deg, var(--accent2), var(--accent)); }
  .feat-pct { font-size: 11px; color: var(--muted); width: 34px; text-align: right; }

  /* Stats row */
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.2rem; text-align: center; }
  .stat-val { font-size: 1.8rem; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .stat-label { font-size: 12px; color: var(--muted); margin-top: 4px; }

  /* Loading */
  .spinner { width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Gauge */
  .gauge-wrap { display: flex; justify-content: center; margin: 1rem 0 0.5rem; }

  .placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; min-height: 260px; color: var(--muted); font-size: 14px; text-align: center; }
  .placeholder svg { opacity: 0.2; }

  /* Note arc */
  .note-arc { display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useCallback } = React;

const FIELDS = [
  { key: 'heures_etude',      label: "Heures d'étude/jour",      min: 0,  max: 12, step: 0.5, unit: 'h',   default: 5 },
  { key: 'absences',          label: "Absences",                  min: 0,  max: 30, step: 1,   unit: '',    default: 5 },
  { key: 'notes_precedentes', label: "Notes précédentes",         min: 0,  max: 20, step: 0.5, unit: '/20', default: 12 },
  { key: 'heures_sommeil',    label: "Sommeil/nuit",              min: 3,  max: 12, step: 0.5, unit: 'h',   default: 7 },
  { key: 'participation',     label: "Participation",             min: 0,  max: 10, step: 1,   unit: '/10', default: 6 },
  { key: 'reseaux_sociaux',   label: "Réseaux sociaux/jour",      min: 0,  max: 10, step: 0.5, unit: 'h',   default: 3 },
  { key: 'motivation',        label: "Motivation",                min: 1,  max: 10, step: 1,   unit: '/10', default: 7 },
  { key: 'soutien_famille',   label: "Soutien familial",          min: 0,  max: 10, step: 1,   unit: '/10', default: 6 },
  { key: 'activite_extra',    label: "Activités extra",           min: 0,  max: 10, step: 1,   unit: 'h',   default: 2 },
  { key: 'stress',            label: "Niveau de stress",          min: 1,  max: 10, step: 1,   unit: '/10', default: 5 },
];

const FEAT_LABELS = {
  heures_etude: "Heures d'étude",
  notes_precedentes: "Notes précédentes",
  absences: "Absences",
  motivation: "Motivation",
  reseaux_sociaux: "Réseaux sociaux",
  heures_sommeil: "Sommeil",
  participation: "Participation",
  stress: "Stress",
  soutien_famille: "Soutien familial",
  activite_extra: "Activités extra",
};

const NIVEAU_COLORS = {
  'Très Bien': 'green', 'Bien': 'blue', 'Assez Bien': 'amber',
  'Passable': 'amber', 'Insuffisant': 'red',
};

function GaugeSVG({ value, max = 20 }) {
  const pct = Math.min(value / max, 1);
  const r = 60, cx = 80, cy = 75;
  const startAngle = Math.PI;
  const endAngle = 0;
  const angle = startAngle + pct * Math.PI;
  const x1 = cx + r * Math.cos(startAngle);
  const y1 = cy + r * Math.sin(startAngle);
  const x2 = cx + r * Math.cos(endAngle);
  const y2 = cy + r * Math.sin(endAngle);
  const px = cx + r * Math.cos(angle);
  const py = cy + r * Math.sin(angle);
  const color = value >= 14 ? '#22d3a5' : value >= 10 ? '#4f8ef7' : value >= 8 ? '#f5a623' : '#f05a5a';
  const arc = (ax, ay) => `M ${x1} ${y1} A ${r} ${r} 0 0 1 ${ax} ${ay}`;
  return (
    <svg width="160" height="100" viewBox="0 0 160 100">
      <path d={arc(x2, y2)} fill="none" stroke="#2a3347" strokeWidth="10" strokeLinecap="round"/>
      <path d={arc(px, py)} fill="none" stroke={color} strokeWidth="10" strokeLinecap="round"/>
      <circle cx={px} cy={py} r="5" fill="#fff"/>
      <text x={cx} y={cy + 10} textAnchor="middle" fill={color} fontSize="22" fontWeight="700">{value.toFixed(1)}</text>
      <text x={cx} y={cy + 26} textAnchor="middle" fill="#7a8aa8" fontSize="11">sur 20</text>
      <text x="22" y="92" fill="#7a8aa8" fontSize="10">0</text>
      <text x="132" y="92" fill="#7a8aa8" fontSize="10">20</text>
    </svg>
  );
}

function ProbBar({ label, value, color }) {
  const colors = { green: '#22d3a5', red: '#f05a5a', blue: '#4f8ef7', amber: '#f5a623' };
  return (
    <div className="progress-wrap">
      <div className="progress-label"><span>{label}</span><span style={{color: colors[color] || '#4f8ef7', fontWeight:600}}>{value.toFixed(1)}%</span></div>
      <div className="progress-bar">
        <div className="progress-fill" style={{width: value + '%', background: colors[color]}}/>
      </div>
    </div>
  );
}

function ResultPanel({ result }) {
  if (!result) return (
    <div className="placeholder">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="28" stroke="#7a8aa8" strokeWidth="2"/>
        <path d="M32 20v14M32 40h.01" stroke="#7a8aa8" strokeWidth="2.5" strokeLinecap="round"/>
      </svg>
      <div>Remplissez le formulaire et<br/>cliquez sur <strong style={{color:'#e8edf5'}}>Analyser</strong> pour obtenir la prédiction</div>
    </div>
  );

  const { reussite, note_finale, risque_abandon, niveau_performance, feature_importances } = result;
  const niveauColor = NIVEAU_COLORS[niveau_performance.prediction] || 'blue';
  const topFeats = Object.entries(feature_importances)
    .sort((a, b) => b[1] - a[1]).slice(0, 6);
  const maxFeat = topFeats[0]?.[1] || 1;

  return (
    <div>
      {/* Note gauge */}
      <div className="note-arc">
        <GaugeSVG value={note_finale.prediction}/>
      </div>

      {/* Main cards */}
      <div className="result-grid">
        <div className="result-card">
          <div className="result-label">Résultat</div>
          <div className={`tag ${reussite.prediction === 1 ? 'tag-green' : 'tag-red'}`} style={{fontSize:15, padding:'6px 14px'}}>
            {reussite.prediction === 1 ? '✓ Réussite' : '✗ Échec'}
          </div>
          <div className="result-sub" style={{marginTop:8}}>Confiance : {reussite.probabilite}%</div>
        </div>
        <div className="result-card">
          <div className="result-label">Niveau</div>
          <div className={`tag tag-${niveauColor}`} style={{fontSize:15, padding:'6px 14px'}}>
            {niveau_performance.prediction}
          </div>
          <div className="result-sub" style={{marginTop:8}}>{note_finale.sur_20}</div>
        </div>
      </div>

      {/* Probabilities */}
      <div className="card" style={{marginBottom:'1rem'}}>
        <div className="card-title">Probabilités détaillées</div>
        <ProbBar label="Probabilité de réussite" value={reussite.proba_reussite} color="green"/>
        <ProbBar label="Probabilité d'échec" value={reussite.proba_echec} color="red"/>
        <div style={{borderTop:'1px solid var(--border)', margin:'0.8rem 0'}}/>
        <ProbBar
          label={risque_abandon.prediction === 1 ? "⚠ Risque d'abandon élevé" : "Risque d'abandon"}
          value={risque_abandon.proba_risque}
          color={risque_abandon.prediction === 1 ? 'red' : 'green'}
        />
      </div>

      {/* Feature importances */}
      {topFeats.length > 0 && (
        <div className="card">
          <div className="card-title">Facteurs les plus influents</div>
          {topFeats.map(([key, val]) => (
            <div className="feat-row" key={key}>
              <div className="feat-name">{FEAT_LABELS[key] || key}</div>
              <div className="feat-bar-wrap">
                <div className="feat-bar-fill" style={{width: (val / maxFeat * 100) + '%'}}/>
              </div>
              <div className="feat-pct">{val.toFixed(1)}%</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function App() {
  const defaults = Object.fromEntries(FIELDS.map(f => [f.key, f.default]));
  const [values, setValues] = useState(defaults);
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [stats] = useState({ total: 3000, reussite: 84.1, abandon: 45.6, note: 14.0 });

  const handleChange = useCallback((key, val) => {
    setValues(v => ({ ...v, [key]: parseFloat(val) }));
  }, []);

  const pct = (val, min, max) => ((val - min) / (max - min) * 100).toFixed(1) + '%';

  const handlePredict = async () => {
    setLoading(true);
    setError(null);
    try {
      const res = await fetch('http://localhost:8000/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(values),
      });
      if (!res.ok) throw new Error(`Erreur API: ${res.status}`);
      const data = await res.json();
      setResult(data);
    } catch (e) {
      // Simulation locale si l'API n'est pas lancée
      const score = (
        values.heures_etude * 1.0 + values.notes_precedentes * 0.35
        + values.participation * 0.25 + values.heures_sommeil * 0.2
        + values.motivation * 0.2 - values.absences * 0.45
        - values.reseaux_sociaux * 0.45 - values.stress * 0.2
        + values.soutien_famille * 0.1
      );
      const note = Math.min(20, Math.max(0, score * 0.95 + 7));
      const reussite = note >= 10;
      const probR = reussite ? Math.min(99, 60 + note * 2.5) : Math.max(5, note * 4);
      const probA = Math.max(5, 60 - values.motivation * 5 + values.absences * 2 - values.heures_etude * 3);
      const niveaux = [[14,'Très Bien'],[12,'Bien'],[10,'Assez Bien'],[8,'Passable'],[0,'Insuffisant']];
      const niveau = niveaux.find(([seuil]) => note >= seuil)[1];
      setResult({
        reussite: { prediction: reussite?1:0, label: reussite?'Réussite':'Échec', probabilite: probR.toFixed(1), proba_reussite: probR.toFixed(1), proba_echec: (100-probR).toFixed(1) },
        note_finale: { prediction: note, sur_20: note.toFixed(1)+'/20' },
        risque_abandon: { prediction: probA>50?1:0, label: probA>50?'Risque élevé':'Risque faible', probabilite: probA.toFixed(1), proba_risque: probA.toFixed(1) },
        niveau_performance: { prediction: niveau },
        feature_importances: { heures_etude:18.4, notes_precedentes:15.2, absences:14.8, motivation:12.1, reseaux_sociaux:11.6, heures_sommeil:9.3, participation:8.7, stress:5.2, soutien_famille:3.1, activite_extra:1.6 },
      });
    }
    setLoading(false);
  };

  return (
    <div className="app">
      <div className="header">
        <div className="header-badge">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="5" stroke="currentColor" strokeWidth="1.5"/><path d="M6 4v3M6 8.5h.01" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>
          Machine Learning · scikit-learn
        </div>
        <h1>Student Predictor</h1>
        <p>Prédiction de réussite académique basée sur vos habitudes et performances</p>
      </div>

      <div className="stats-row">
        <div className="stat-card">
          <div className="stat-val">3 000</div>
          <div className="stat-label">Étudiants dans le dataset</div>
        </div>
        <div className="stat-card">
          <div className="stat-val">84%</div>
          <div className="stat-label">Taux de réussite moyen</div>
        </div>
        <div className="stat-card">
          <div className="stat-val">96.5%</div>
          <div className="stat-label">Précision du modèle</div>
        </div>
      </div>

      <div className="grid">
        {/* Form */}
        <div className="card">
          <div className="card-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Profil de l'étudiant
          </div>
          {FIELDS.map(f => (
            <div className="form-group" key={f.key}>
              <div className="form-label">
                <span>{f.label}</span>
                <span className="form-value">{values[f.key]}{f.unit}</span>
              </div>
              <input
                type="range" min={f.min} max={f.max} step={f.step}
                value={values[f.key]}
                style={{'--pct': pct(values[f.key], f.min, f.max)}}
                onChange={e => handleChange(f.key, e.target.value)}
              />
            </div>
          ))}
          <button className="btn" onClick={handlePredict} disabled={loading}>
            {loading ? <><span className="spinner"/>Analyse en cours...</> : '⚡ Analyser le profil'}
          </button>
          {error && <div style={{marginTop:'0.8rem', color:'var(--red)', fontSize:13}}>{error}</div>}
        </div>

        {/* Results */}
        <div className="card">
          <div className="card-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            Résultats de la prédiction
          </div>
          <ResultPanel result={result}/>
        </div>
      </div>

      <div style={{textAlign:'center', marginTop:'2rem', color:'var(--muted)', fontSize:12}}>
        Backend FastAPI · scikit-learn Gradient Boosting · Dataset synthétique 3 000 étudiants
      </div>
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>
